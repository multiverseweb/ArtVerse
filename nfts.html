<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" class="favicon" type="image/x-icon" href="artworks/favicon.png">
    <link rel="stylesheet" href="codes/style.css">
    <title>Tejas | ArtVerse</title>
</head>

<body id="body">
    <section class="BigContainer" id="BigContainer">
        <div id="display">
            <button class="calanderBtn" onclick=toggleCalendar()><img src="artworks/close.png" alt=""
                    id="calanderImg"></button>
            <nav class="calander" id="calander">
                <a href="#2025">2025</a>
                <a href="#2023">2023</a>
                <a href="#2022">2022</a>
            </nav>
            <div class="type" id="type">
                <a class="artBtn" href="index.html">Paper</a>
                <a class="nftBtn" href="nfts.html" id="current">Digital</a>
            </div>
            <p class="heading">Tejas'<br>NFTs</p>
            <div class="top">
                <p class="intro">I showcase my NFTs here.</p>
                <button class="write" onclick="nft_review()">Read/Write Comments</button>
            </div>
            <section class="container" id="container">
                <div class="frame" id="2025">
                    <img class="art" src="nfts/flat.png" alt="">
                    <div class="info">
                        <p class="name">The Flat</p>
                        <p class="date">13-04-2025</p>
                    </div>
                </div>
                <div class="frame" id="2023">
                    <img class="art" src="nfts/tram.png" alt="">
                    <div class="info">
                        <p class="name">The Tram</p>
                        <p class="date">22-03-2023</p>
                    </div>
                </div>
                <div class="frame" id="2022">
                    <img class="art" src="nfts/library.png" alt="">
                    <div class="info">
                        <p class="name">The Library</p>
                        <p class="date">05-01-2022</p>
                    </div>
                </div>
                <div class="frame">
                    <img class="art" src="nfts/van.png" alt="">
                    <div class="info">
                        <p class="name">The Van</p>
                        <p class="date">01-01-2022</p>
                    </div>
                </div>
            </section>

            <!-- Modal for displaying full-sized artwork -->
            <div id="artModal" class="modal">
                <span class="close">&times;</span>
                <img class="modal-content" id="modalImage">
                <div id="caption"></div>
            </div>
        </div>
    </section>
    <div class="credits">&copy; 2024-<span class="year"></span> <a href="https://tejas-links.netlify.app">Tejas
            Gupta</a>. All Rights
        Reserved.
    </div>
    <script src="codes/script.js"></script>
</body>

</html>
